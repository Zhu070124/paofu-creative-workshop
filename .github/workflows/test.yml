name: Smoke Test
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -c "compile(open('server.py', encoding='utf-8').read(), 'server.py', 'exec'); print('server.py OK')"
      - run: python -c "compile(open('agent_client.py', encoding='utf-8').read(), 'agent_client.py', 'exec'); print('agent_client.py OK')"
