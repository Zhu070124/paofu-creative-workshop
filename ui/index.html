<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泡芙的创意工坊</title>
<style>
:root {
  --bg: #FFF8F3; --surface: #FFFFFF; --border: #F0E8E0;
  --text: #5D4E37; --dim: #B5A898;
  --puff: #F4A7B9; --puff-soft: #FDF0F3;
  --hermes: #A7C7E7; --hermes-soft: #F0F5FB;
  --claude: #C3B1E1; --claude-soft: #F6F3FB;
  --paofu: #F8C06D; --paofu-soft: #FFF8ED;
  --accent: #F8C06D; --radius: 16px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); height:100vh; display:flex; }

.sidebar {
  width: 340px; min-width: 340px; background: var(--surface);
  border-right: 1px solid var(--border); display:flex; flex-direction:column;
}
.sidebar-header { padding: 24px 24px 16px; }
.sidebar-header h1 { font-size: 20px; font-weight: 700; }
.sidebar-header .subtitle { color: var(--dim); font-size: 12px; margin-top: 2px; }
.agent-status { padding: 0 24px 12px; display:flex; gap:12px; }
.agent-dot { font-size: 12px; display:flex; align-items:center; gap:4px; }
.agent-dot .dot { width: 7px; height: 7px; border-radius: 50%; background: #ccc; transition: background 0.3s; }
.agent-dot .dot.on { background: #7ee787; }

.chat-init { flex:1; padding: 0 24px 16px; display:flex; flex-direction:column; border-bottom: 1px solid var(--border); overflow-y:auto; }
.chat-init label { font-size: 11px; font-weight: 600; text-transform: uppercase; color: var(--dim); letter-spacing: 1px; margin-bottom: 8px; }
.chat-init textarea {
  width: 100%; flex: 1; min-height: 80px; background: var(--bg); border: 1.5px solid var(--border);
  color: var(--text); border-radius: var(--radius); padding: 14px; font-size: 14px;
  resize: none; font-family: inherit; outline: none; transition: border 0.2s;
}
.chat-init textarea:focus { border-color: var(--accent); }
.btn-row { display:flex; gap:8px; margin-top: 10px; }
.btn {
  padding: 10px 20px; border: none; border-radius: 12px; cursor: pointer;
  font-weight: 600; font-size: 13px; transition: all 0.2s; font-family: inherit;
}
.btn-start { flex:1; background: var(--accent); color: #fff; }
.btn-start:hover { filter: brightness(1.05); transform: translateY(-1px); }
.btn-start:disabled { opacity: 0.5; cursor: not-allowed; transform: none; filter: none; }
.btn-stop { background: #FFB3B3; color: #fff; display:none; }
.btn-stop:hover { background: #FF8C8C; }

.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.chat-header {
  padding: 20px 28px; background: var(--surface); border-bottom: 1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.chat-header .topic { font-size: 15px; font-weight: 600; }
.chat-header .round-badge { font-size: 11px; padding: 4px 12px; border-radius: 20px; background: var(--accent); color: #fff; font-weight: 500; }

.chat-stream { flex:1; overflow-y:auto; padding: 24px 28px; display:flex; flex-direction:column; gap:14px; }
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color: var(--dim); gap:12px; }
.empty-state .bubble { width: 80px; height: 80px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-size: 32px; background:linear-gradient(135deg,var(--puff),var(--claude)); }
.empty-state p { font-size: 14px; }

.agent-msg { padding: 14px 18px; border-radius: 20px; max-width: 75%; font-size: 14px; line-height: 1.6; }
.agent-msg .agent-badge { font-size: 11px; font-weight: 700; margin-bottom: 5px; display:flex; align-items:center; gap:6px; }
.agent-msg .agent-badge .dot { width: 8px; height: 8px; border-radius: 50%; }
.agent-msg.puff { background: var(--puff-soft); align-self:flex-start; border-radius: 20px 20px 20px 4px; } .agent-msg.puff .dot { background: var(--puff); }
.agent-msg.hermes { background: var(--hermes-soft); align-self:flex-start; border-radius: 20px 20px 20px 4px; } .agent-msg.hermes .dot { background: var(--hermes); }
.agent-msg.claude { background: var(--claude-soft); align-self:flex-start; border-radius: 20px 20px 20px 4px; } .agent-msg.claude .dot { background: var(--claude); }
.agent-msg.paofu { background: var(--paofu-soft); align-self:flex-end; border-radius: 20px 20px 4px 20px; border: 2px solid var(--paofu); } .agent-msg.paofu .dot { background: var(--paofu); }
.system-msg { text-align: center; font-size: 11px; color: var(--dim); padding: 2px 0; }
.system-msg span { background: var(--surface); border: 1px solid var(--border); padding: 3px 14px; border-radius: 12px; }

.chat-input { padding: 16px 28px; background: var(--surface); border-top: 1px solid var(--border); display:flex; gap:10px; }
.chat-input input {
  flex:1; background: var(--bg); border: 1.5px solid var(--border); color: var(--text);
  border-radius: 14px; padding: 12px 16px; font-size: 14px; font-family: inherit; outline: none;
}
.chat-input input:focus { border-color: var(--accent); }
.chat-input button { padding: 10px 22px; background: var(--accent); color: #fff; border: none; border-radius: 14px; cursor: pointer; font-weight: 600; font-size: 14px; font-family: inherit; }
.chat-input button:hover { filter: brightness(1.05); }
.chat-input button:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-header">
    <h1>🏭 泡芙的创意工坊</h1>
    <div class="subtitle">Puff · Hermes · Claude Code</div>
  </div>
  <div class="agent-status" id="agentStatus">
    <div class="agent-dot"><span class="dot on" id="dot-paofu"></span>泡芙</div>
    <div class="agent-dot"><span class="dot" id="dot-puff"></span>Puff</div>
    <div class="agent-dot"><span class="dot" id="dot-hermes"></span>Hermes</div>
    <div class="agent-dot"><span class="dot" id="dot-claude"></span>Claude</div>
  </div>
  <div style="padding:16px 24px; color:var(--dim); font-size:12px; border-bottom:1px solid var(--border);">
    在下方输入框发言，Agent 自动回应
  </div>
</aside>

<main class="main">
  <div class="chat-header">
    <span class="topic" id="chatTopic">等待 Agent 连接…</span>
    <span class="round-badge" id="roundInfo" style="display:none"></span>
  </div>
  <div class="chat-stream" id="chatStream">
    <div class="empty-state">
      <div class="bubble">💬</div>
      <p>在下方输入框开始聊天</p>
    </div>
  </div>
  <div class="chat-input">
    <input type="text" id="msgInput" placeholder="说点什么..." onkeydown="if(event.key==='Enter')sendMessage()">
    <button id="sendBtn" onclick="sendMessage()">发送</button>
  </div>
</main>

<script>
let sessionActive = false, eventSource = null, sseRetries = 0;

function connectSSE() {
  if (eventSource) eventSource.close();
  eventSource = new EventSource('/api/stream');

  eventSource.addEventListener('history', e => {
    try {
      document.getElementById('chatStream').innerHTML = '';
      JSON.parse(e.data).forEach(m => appendMsg({
        type: 'agent_message', agent: m.role, content: m.content
      }));
    } catch(_){}
  });
  eventSource.addEventListener('message', e => {
    try {
      const m = JSON.parse(e.data);
      if (m.type === 'agent_joined') {
        document.getElementById(`dot-${m.agent}`)?.classList.add('on');
        appendMsg({type:'system', content:`${label(m.agent)} 已加入`});
      } else if (m.type === 'agent_left') {
        document.getElementById(`dot-${m.agent}`)?.classList.remove('on');
        appendMsg({type:'system', content:`${label(m.agent)} 已离开`});
      } else if (m.type === 'session_start') {
        sessionActive = true;
        document.getElementById('chatTopic').textContent = m.topic;
        document.getElementById('chatStream').innerHTML = '';
      } else if (m.type === 'user_message') {
        appendMsg({type:'agent_message', agent:'paofu', content:m.content});
      } else if (m.type === 'agent_message') {
        appendMsg(m);
      } else if (m.type === 'round_start') {
        document.getElementById('roundInfo').style.display = 'block';
        document.getElementById('roundInfo').textContent = `第 ${m.round} 轮`;
        appendMsg({type:'system', content:`— 第 ${m.round} 轮 —`});
      } else if (m.type === 'session_complete') {
        sessionActive = false;
        appendMsg({type:'system', content:'✓ 讨论结束'});
        document.getElementById('roundInfo').style.display = 'none';
      }
    } catch(_){}
  });
  eventSource.onerror = () => {
    if (eventSource.readyState === EventSource.CLOSED && sseRetries < 5) {
      sseRetries++; setTimeout(connectSSE, 3000);
    }
  };
  eventSource.onopen = () => { sseRetries = 0; };
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const c = input.value.trim();
  if (!c) return;
  input.value = '';

  // Auto-start session on first message
  if (!sessionActive) {
    await fetch('/api/session/start', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({topic:c})});
    sessionActive = true;
  }

  fetch('/api/message', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({content:c})});
}
function appendMsg(m) {
  const el = document.getElementById('chatStream'), div = document.createElement('div');
  const a = m.agent||'system';
  if (m.type==='agent_message'||a==='paofu') {
    div.className = `agent-msg ${a}`;
    div.innerHTML = `<div class="agent-badge"><span class="dot"></span>${label(a)}</div>${esc(m.content)}`;
  } else if (m.type==='user') {
    div.className = `agent-msg paofu`;
    div.innerHTML = `<div class="agent-badge"><span class="dot"></span>${label('paofu')}</div>${esc(m.content)}`;
  } else { div.className='system-msg'; div.innerHTML=`<span>${m.content}</span>`; }
  el.appendChild(div); el.scrollTop=el.scrollHeight;
}
function label(a) { return {puff:'Puff 🩷', hermes:'Hermes 💙', claude:'Claude 💜', paofu:'泡芙 🧡'}[a]||a; }
function esc(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

// Periodic state check
setInterval(async () => {
  try {
    const s = await fetch('/api/state').then(r=>r.json());
    ['puff','hermes','claude'].forEach(name => {
      document.getElementById(`dot-${name}`)?.classList.toggle('on', s.agents?.includes(name));
    });
    if (s.active && !sessionActive) {
      sessionActive = true;
      document.getElementById('chatTopic').textContent = s.topic;
      document.getElementById('startBtn').disabled = true;
      document.getElementById('stopBtn').style.display = 'block';
      document.getElementById('msgInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;
    }
  } catch(_) {}
}, 3000);

connectSSE();
</script>
</body>
</html>
